name: Deploy ZUARA Neon Function

on:
  push:
    branches:
      - supabase-web-migration
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Neon CLI
        run: npm install -g neonctl@latest

      - name: Install project dependencies
        run: npm install

      - name: Apply ZUARA database migration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          test -n "$NEON_API_KEY"
          test -n "$NEON_PROJECT_ID"
          neonctl psql production --api-key "$NEON_API_KEY" --project-id "$NEON_PROJECT_ID" -- -v ON_ERROR_STOP=1 -f migration/0004_neon_zuara_mutations.sql

      - name: Deploy ZUARA Function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          neonctl deploy --api-key "$NEON_API_KEY" --project-id "$NEON_PROJECT_ID" --branch production --update-existing

      - name: Show deployed ZUARA Function
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: neonctl function list --api-key "$NEON_API_KEY" --project-id "$NEON_PROJECT_ID" --branch production
