<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ZUARA APP</title>
<desc id="desc">Z negra con textura de trenza sobre un fondo elegante degradado marfil y dorado.</desc>
