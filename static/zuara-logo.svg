<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">ZUARA APP</title>
<desc id="desc">Monograma Z negro con efecto de trenzado dorado sobre un degradado marfil a dorado.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffefa"/>
    <stop offset=".34" stop-color="#f8f0da"/>
    <stop offset=".68" stop-color="#ead08e"/>
    <stop offset="1" stop-color="#b98a32"/>
  </linearGradient>
  <radialGradient id="shine" cx=".22" cy=".16" r=".86">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
    <stop offset=".42" stop-color="#fff" stop-opacity=".28"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff4c9"/>
    <stop offset=".48" stop-color="#d3aa57"/>
    <stop offset="1" stop-color="#8d641c"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#4d360e" flood-opacity=".28"/>
  </filter>
  <pattern id="braid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M-11 18 C-2 5 7 5 16 18 S34 31 43 18" fill="none" stroke="#d7b160" stroke-width="7" stroke-linecap="round"/>
    <path d="M1 0 C10 13 19 13 28 0 M15 44 C24 31 33 31 42 44" fill="none" stroke="#f9edc9" stroke-width="5" stroke-linecap="round"/>
    <path d="M-5 33 C4 20 13 20 22 33 S40 46 49 33" fill="none" stroke="#070707" stroke-width="3.4" stroke-linecap="round" stroke-opacity=".72"/>
  </pattern>
  <mask id="z">
    <path d="M86 125 H426 L102 387 H426" fill="none" stroke="#fff" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
</defs>

<rect x="8" y="8" width="496" height="496" rx="92" fill="url(#bg)"/>
<rect x="8" y="8" width="496" height="496" rx="92" fill="url(#shine)"/>
<rect x="17" y="17" width="478" height="478" rx="83" fill="none" stroke="url(#edge)" stroke-width="5"/>
<rect x="29" y="29" width="454" height="454" rx="71" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="2"/>

<path d="M86 125 H426 L102 387 H426"
      fill="none" stroke="#050505" stroke-width="124"
      stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

<rect x="45" y="58" width="422" height="396" fill="url(#braid)" mask="url(#z)"/>

<path d="M91 125 H421" fill="none" stroke="#ffffff" stroke-opacity=".78" stroke-width="4" stroke-linecap="round"/>
<path d="M91 125 H421" fill="none" stroke="#c59a43" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>
<path d="M106 387 H421" fill="none" stroke="#ffffff" stroke-opacity=".70" stroke-width="4" stroke-linecap="round"/>
<path d="M106 387 H421" fill="none" stroke="#c59a43" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>

<path d="M337 194 l27 15 M315 212 l27 15 M293 230 l27 15 M271 248 l27 15 M249 266 l27 15 M227 284 l27 15 M205 302 l27 15"
      fill="none" stroke="#e0c071" stroke-width="7" stroke-linecap="round" opacity=".92"/>
<path d="M348 187 l27 15 M326 205 l27 15 M304 223 l27 15 M282 241 l27 15 M260 259 l27 15 M238 277 l27 15 M216 295 l27 15"
      fill="none" stroke="#fff4d3" stroke-width="4.2" stroke-linecap="round" opacity=".88"/>

<circle cx="86" cy="125" r="8" fill="#f8e7ae"/>
<circle cx="426" cy="125" r="8" fill="#d2a653"/>
<circle cx="102" cy="387" r="8" fill="#f8e7ae"/>
<circle cx="426" cy="387" r="8" fill="#d2a653"/>
</svg>