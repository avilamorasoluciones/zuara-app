<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZUARA APP</title>
  <desc id="desc">Z trenzada en negro con reflejos dorados sobre un fondo degradado negro y dorado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset=".42" stop-color="#1a1408"/>
      <stop offset=".72" stop-color="#7a5a1b"/>
      <stop offset="1" stop-color="#d8b765"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020202"/>
      <stop offset=".28" stop-color="#17130d"/>
      <stop offset=".48" stop-color="#3b2a11"/>
      <stop offset=".62" stop-color="#090909"/>
      <stop offset=".82" stop-color="#5b4215"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d4d12"/>
      <stop offset=".45" stop-color="#f1d17a"/>
      <stop offset="1" stop-color="#8f6a27"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="braid" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="none"/>
      <path d="M-18 12 C2 -10 28 -10 48 12 S94 34 112 12" fill="none" stroke="#070707" stroke-width="25" stroke-linecap="round"/>
      <path d="M-18 60 C2 38 28 38 48 60 S94 82 112 60" fill="none" stroke="#1e170c" stroke-width="25" stroke-linecap="round"/>
      <path d="M-18 12 C2 -10 28 -10 48 12" fill="none" stroke="#c99e3e" stroke-opacity=".48" stroke-width="4" stroke-linecap="round"/>
      <path d="M24 48 C40 30 56 30 72 48" fill="none" stroke="#e3be61" stroke-opacity=".42" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <clipPath id="zclip">
      <path d="M92 124 H420 C351 180 304 227 250 281 C201 330 160 378 94 422 H420" fill="none" stroke="#000" stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="492" height="492" rx="76" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="66" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".9"/>
  <rect x="32" y="32" width="448" height="448" rx="58" fill="none" stroke="#f1d17a" stroke-opacity=".12"/>

  <path d="M92 124 H420 C351 180 304 227 250 281 C201 330 160 378 94 422 H420"
        fill="none" stroke="#000" stroke-opacity=".35" stroke-width="122"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>

  <path d="M92 124 H420 C351 180 304 227 250 281 C201 330 160 378 94 422 H420"
        fill="none" stroke="url(#hair)" stroke-width="108"
        stroke-linecap="round" stroke-linejoin="round"/>

  <g clip-path="url(#zclip)">
    <rect x="38" y="70" width="438" height="410" fill="url(#braid)" opacity=".95"/>
  </g>

  <!-- Interlacing highlights that reinforce the braided texture -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M100 124 C126 105 153 105 179 124 S231 143 257 124" stroke="#e6c56f" stroke-opacity=".6" stroke-width="6"/>
    <path d="M263 124 C289 105 316 105 342 124 S394 143 416 125" stroke="#8e6923" stroke-width="6"/>
    <path d="M352 182 C332 195 312 210 293 226" stroke="#e5c36b" stroke-opacity=".58" stroke-width="6"/>
    <path d="M290 226 C271 242 252 257 236 274" stroke="#76541a" stroke-width="6"/>
    <path d="M226 287 C207 304 190 320 173 337" stroke="#e5c36b" stroke-opacity=".55" stroke-width="6"/>
    <path d="M164 348 C145 366 128 384 108 411" stroke="#76541a" stroke-width="6"/>
    <path d="M98 422 C124 403 150 403 176 422 S228 441 254 422" stroke="#e6c56f" stroke-opacity=".58" stroke-width="6"/>
    <path d="M260 422 C286 403 312 403 338 422 S390 441 416 422" stroke="#8e6923" stroke-width="6"/>
  </g>

  <!-- Fine hair sheen -->
  <g fill="none" stroke="#fff2bd" stroke-opacity=".22" stroke-width="2">
    <path d="M96 115 H410"/>
    <path d="M110 438 H406"/>
    <path d="M352 176 C320 202 286 236 254 269"/>
    <path d="M240 295 C204 329 169 363 132 399"/>
  </g>

  <circle cx="92" cy="124" r="7" fill="#f1d17a" opacity=".75"/>
  <circle cx="420" cy="422" r="7" fill="#f1d17a" opacity=".75"/>
</svg>